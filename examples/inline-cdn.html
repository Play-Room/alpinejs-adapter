<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayRoom Alpine Adapter - Inline CDN Example</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
      }

      .app {
        max-width: 1100px;
        margin: 2rem auto;
        padding: 1rem;
      }

      .toolbar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      .toolbar > button {
        border: 0;
        border-radius: 8px;
        padding: 0.55rem 0.8rem;
        background: #0f766e;
        color: #ffffff;
        cursor: pointer;
      }

      .toolbar > button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #playroom-browser {
        min-height: 70vh;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "@play-room/core": "https://cdn.jsdelivr.net/npm/@play-room/core@0.1.2/dist/index.js",
          "@play-room/quizz": "https://cdn.jsdelivr.net/npm/@play-room/quizz@0.1.2/dist/index.js"
        }
      }
    </script>

    <script type="module">
      import playRoomPlugin from "../dist/index.js";

      document.addEventListener("alpine:init", () => {
        window.Alpine.plugin(playRoomPlugin);
      });
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body>
    <main
      class="app"
      x-data="{
        room: null,
        init() {
          this.room = $playroom({
            browserStartMode: 'inline',
            launcher: { mode: 'inline' },
            persistence: { enabled: false }
          });

          this.room.registerDefaultGames({
            config: {
              quizz: {
                limit: 5,
                leaderboardLimit: 15
              }
            }
          });

          this.room.renderGamePicker(document.getElementById('playroom-browser'));
        }
      }"
    >
      <h1>PlayRoom Alpine Adapter (Inline)</h1>
      <div class="toolbar">
        <button :disabled="!room" @click="room.setLocale('en')">English</button>
        <button :disabled="!room" @click="room.setLocale('sr')">Srpski</button>
        <button :disabled="!room" @click="room.setTheme('light')">Light</button>
        <button :disabled="!room" @click="room.setTheme('dark')">Dark</button>
      </div>
      <div id="playroom-browser"></div>
    </main>
  </body>
</html>
